<style>
  :root {
    --teal: #0E7490; --teal-dark: #155E75; --teal-light: #CCFBF1;
    --ink: #1E293B; --sub: #64748B; --line: #E2E8F0; --bg: #F1F5F9;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
  .wrap { max-width:1280px; margin:0 auto; padding:28px 20px 60px; }

  /* header */
  .hero { background:linear-gradient(135deg,#155E75,#0E7490 60%,#0891B2); border-radius:18px; padding:30px 34px; color:#fff; box-shadow:0 10px 30px rgba(14,116,144,.25); }
  .hero .kicker { font-size:13px; letter-spacing:2px; opacity:.85; }
  .hero h1 { font-size:32px; font-weight:800; margin:6px 0 12px; }
  .hero .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.35); border-radius:20px; padding:4px 13px; font-size:12.5px; }

  /* layout */
  .grid { display:grid; grid-template-columns: 360px 1fr; gap:20px; margin-top:22px; }
  @media (max-width:960px){ .grid{ grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:0 2px 10px rgba(15,23,42,.04); }
  .card h2 { font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--teal-dark); }
  .card h2::before { content:""; width:8px; height:16px; border-radius:4px; background:var(--teal); }
  .left { display:flex; flex-direction:column; gap:20px; }

  /* meta / objectives / glossary */
  .kv { display:flex; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .kv:last-child{ border-bottom:none; }
  .kv .k { width:76px; color:var(--sub); flex-shrink:0; }
  .obj { font-size:13px; margin-bottom:9px; padding-left:12px; border-left:3px solid var(--teal-light); }
  .obj b { color:var(--teal-dark); }
  .gloss { font-size:13px; padding:7px 0; border-bottom:1px dashed var(--line); }
  .gloss:last-child{ border-bottom:none; }
  .gloss b { color:var(--teal-dark); }

  /* knowledge tree */
  .tree { font-size:13.5px; }
  .tnode { margin:3px 0; }
  .trow { display:flex; align-items:flex-start; gap:9px; padding:6px 10px; border-radius:9px; cursor:pointer; border:1px solid transparent; transition:background .15s; }
  .trow:hover { background:#F0FDFA; }
  .trow.open { background:#F0FDFA; border-color:#99F6E4; }
  .tmark { width:12px; font-size:11px; color:var(--sub); flex-shrink:0; margin-top:4px; }
  .tcat { font-weight:700; color:var(--teal-dark); }
  .tkp { display:inline-block; width:11px; height:11px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .tname { font-weight:600; }
  .tmeta { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .pill { font-size:11px; border-radius:5px; padding:1px 7px; }
  .pill.cog { color:#fff; font-weight:600; }
  .pill.cat { background:#F1F5F9; color:#475569; }
  .pill.tag { background:#FEF3C7; color:#92400E; }
  .tdetail { display:none; margin:2px 0 8px 34px; padding:10px 14px; background:#F8FAFC; border-left:3px solid var(--teal); border-radius:0 8px 8px 0; font-size:12.8px; color:#334155; }
  .trow.open + .tdetail { display:block; }
  .tdetail .drow { margin-bottom:6px; }
  .tdetail .dl { color:var(--sub); }
  .tdetail .obj-line { color:#0F766E; font-weight:600; }
  .rel { font-size:12px; }
  .rel .rt { display:inline-block; font-size:10.5px; border-radius:4px; padding:0 6px; margin-right:4px; color:#fff; }
  .rt.pre{ background:#1D4ED8; } .rt.post{ background:#7C3AED; } .rt.rel{ background:#64748B; }
  .lvl-label { color:#94A3B8; font-size:11.5px; margin-left:auto; flex-shrink:0; }

  /* tables */
  table { width:100%; border-collapse:collapse; font-size:12.8px; }
  th { background:var(--teal-dark); color:#fff; font-weight:700; text-align:left; padding:8px 10px; }
  td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr:nth-child(even) td { background:#F8FAFC; }
  .right { display:flex; flex-direction:column; gap:20px; }
  .foot { margin-top:22px; text-align:center; color:#94A3B8; font-size:12px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:11.5px; color:var(--sub); }
  .legend span { display:flex; align-items:center; gap:5px; }
</style>
</head>

  {
   "term": "Transformer",
   "definition": "基于注意力机制的架构，大语言模型（LLM）的基础，也用于多模态生成"
  },
  {
   "term": "机器学习",
   "definition": "AI的分支，让计算机从数据中学习规律；深度学习是其基于神经网络的子集"
  },
  {
   "term": "提示词工程",
   "definition": "通过设计提示词引导AI输出的技术（第2章重点，本课仅概念引入）"
  }
 ]
}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("lesson-data").textContent);
  var COG_COLORS = { "记忆":"#94A3B8","理解":"#38BDF8","应用":"#34D399","分析":"#FBBF24","评价":"#FB923C","创造":"#F87171" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function join(arr, sep) { return (arr && arr.length) ? esc(arr.join(";")) : "—"; }

  function buildTree(nodes) {
    var byName = {}; nodes.forEach(function (n) { byName[n.name] = n; });
    var stack = [], roots = [];
    nodes.forEach(function (n) {
      while (stack.length && stack[stack.length - 1].level >= n.level) stack.pop();
      if (stack.length) { (stack[stack.length - 1].children = stack[stack.length - 1].children || []).push(n); }
      else roots.push(n);
      stack.push(n);
    });
    return roots;
  }

  function renderTree(nodes, level) {
    var html = "";
    nodes.forEach(function (n) {
      var kids = n.children || [];
      var cogColor = COG_COLORS[n.cognitive] || "";
      var meta = [];
      if (n.cognitive) meta.push('<span class="pill cog" style="background:' + cogColor + '">' + esc(n.cognitive) + "</span>");
      if (n.category) meta.push('<span class="pill cat">' + esc(n.category) + "</span>");
      if (n.tags) n.tags.split(";").forEach(function (t) { meta.push('<span class="pill tag">' + esc(t) + "</span>"); });
      var detail = "";
      if (n.node_type === "知识点") {
        var rels = "";
        if ((n.pre || []).length) rels += '<span class="rt pre">前置</span>' + join(n.pre, ";") + "&nbsp; ";
        if ((n.post || []).length) rels += '<span class="rt post">后置</span>' + join(n.post, ";") + "&nbsp; ";
        if ((n.related || []).length) rels += '<span class="rt rel">关联</span>' + join(n.related, ";");
        detail = '<div class="tdetail"><div class="drow obj-line">🎯 ' + esc(n.objective || "（待补教学目标）") + "</div>" +
          (n.description ? '<div class="drow"><span class="dl">说明：</span>' + esc(n.description) + "</div>" : "") +
          (rels ? '<div class="drow rel">' + rels + "</div>" : "") + "</div>";
      }
      var marker = kids.length ? '<span class="tmark">▾</span>' : '<span class="tmark">·</span>';
      var rowName = n.node_type === "分类"
        ? '<span class="tcat">' + esc(n.name) + "</span>"
        : '<span class="tkp" style="background:' + (cogColor || "#0D9488") + '"></span><span class="tname">' + esc(n.name) + "</span>";
      html += '<div class="tnode" style="margin-left:' + (level - 1) * 24 + 'px">' +
        '<div class="trow" onclick="this.classList.toggle(\'open\')">' + marker + rowName +
        (meta.length ? '<span class="tmeta">' + meta.join("") + "</span>" : "") +
        '<span class="lvl-label">L' + n.level + "</span></div>" + detail +
        (kids.length ? '<div class="tnode-children">' + renderTree(kids, level + 1) + "</div>" : "") +
        "</div>";
    });
    return html;
  }

  function renderTables(nodes) {
    var relRows = "", objRows = "";
    nodes.forEach(function (n) {
      if (n.node_type !== "知识点") return;
      relRows += "<tr><td>" + esc(n.name) + "</td><td>" + join(n.pre, ";") + "</td><td>" + join(n.post, ";") +
        "</td><td>" + join(n.related, ";") + "</td><td>" + esc(n.cognitive || "") + "</td><td>" + esc(n.category || "") + "</td></tr>";
      if (n.objective) {
        objRows += "<tr><td>" + esc(n.name) + "</td><td>" + esc(n.objective) + "</td><td>" +
          esc(n.cognitive || "") + "</td><td>" + esc(n.tags || "") + "</td></tr>";
      }
    });
    return {
      rel: relRows || '<tr><td colspan="6">暂无知识点关系</td></tr>',
      obj: objRows || '<tr><td colspan="4">暂无教学目标</td></tr>'
    };
  }

  var meta = data.lesson_meta || {};
  var objectives = data.objectives || {};
  var nodes = data.knowledge_tree || [];
  var roots = buildTree(nodes);
  var tables = renderTables(nodes);
  var glossary = data.glossary || [];

  var html = "";
  html += '<div class="hero"><div class="kicker">KNOWLEDGE GRAPH · 一课一图</div><h1>' + esc(meta.title || "") + "</h1>" +
    '<div class="chips">' +
    (meta.week ? '<span class="chip">' + esc(meta.week) + "</span>" : "") +
    (meta.course_name ? '<span class="chip">' + esc(meta.course_name) + "</span>" : "") +
    (meta.hours ? '<span class="chip">' + esc(meta.hours) + " 学时</span>" : "") +
    (meta.class_name ? '<span class="chip">' + esc(meta.class_name) + "</span>" : "") +
    (meta.course_type ? '<span class="chip">' + esc(meta.course_type) + "</span>" : "") +
    "</div></div>";

  html += '<div class="grid"><div class="left">';

  // 左栏：课程信息
  html += '<div class="card"><h2>课程信息</h2>';
  [["授课课题", meta.title], ["课程名称", meta.course_name], ["周次", meta.week], ["学时", meta.hours],
   ["授课班级", meta.class_name], ["授课教师", meta.teacher], ["授课日期", meta.date], ["课型", meta.course_type]
  ].forEach(function (r) {
    if (r[1]) html += '<div class="kv"><span class="k">' + r[0] + "</span><span>" + esc(r[1]) + "</span></div>";
  });
  html += "</div>";

  // 左栏：三维目标
  html += '<div class="card"><h2>三维教学目标</h2>';
  var objBlocks = [["知识目标", objectives.knowledge], ["能力目标", objectives.ability], ["素质目标", objectives.quality]];
  objBlocks.forEach(function (b) {
    (b[1] || []).forEach(function (o) { html += '<div class="obj"><b>' + b[0] + "：</b>" + esc(o) + "</div>"; });
  });
  html += "</div>";

  // 左栏：术语表
  if (glossary.length) {
    html += '<div class="card"><h2>术语表</h2>';
    glossary.forEach(function (g) { html += '<div class="gloss"><b>' + esc(g.term) + "：</b>" + esc(g.definition) + "</div>"; });
    html += "</div>";
  }
  html += "</div>";

  // 右栏
  html += '<div class="right">';
  html += '<div class="card"><h2>知识树 <span style="font-weight:400;font-size:12px;color:#94A3B8">（点击知识点展开详情）</span></h2><div class="tree">' +
    renderTree(roots, 1) + "</div>" +
    '<div class="legend"><span><span class="pill cog" style="background:#0D9488">分类节点</span></span>' +
    '<span>· 知识点按布鲁姆认知层级着色：</span>' +
    ["记忆","理解","应用","分析","评价","创造"].map(function (c) {
      return '<span><span class="tkp" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + COG_COLORS[c] + '"></span>' + c + "</span>";
    }).join("") + "</div></div>";

  html += '<div class="card"><h2>关系表</h2><table><thead><tr><th>节点</th><th>前置</th><th>后置</th><th>关联</th><th>认知层级</th><th>分类</th></tr></thead><tbody>' +
    tables.rel + "</tbody></table></div>";

  html += '<div class="card"><h2>教学目标索引</h2><table><thead><tr><th>节点</th><th>教学目标</th><th>认知层级</th><th>标签</th></tr></thead><tbody>' +
    tables.obj + "</tbody></table></div>";
  html += "</div></div>";

  html += '<div class="foot">由同一份 lesson.json 生成 · 与教案 docx、Markdown 图谱同源同构 · 备课知识图谱助手</div>';
  document.getElementById("app").innerHTML = html;
})();
</script>
</body>
</html>
